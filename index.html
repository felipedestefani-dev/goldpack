<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goldpack — TCG, colecionáveis e games</title>
  <meta name="description" content="Catálogo da Goldpack. Lacrados, avulsos e acessórios. Compre pelo WhatsApp.">
  <meta name="theme-color" content="#0c0616">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/mimikyu-sprite.webp" as="image">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/banner-ad.css">
</head>
<body>
  <div id="boot" class="boot" role="status" aria-label="Carregando Goldpack">
    <div class="boot-sprite" aria-hidden="true"></div>
    <div class="boot-bar" aria-hidden="true"><span></span></div>
  </div>
  <div id="app"><p class="app-fallback">Não conseguimos abrir a loja agora. <a href="">Recarregar</a></p></div>
  <script>
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.classList.add("is-done");
      setTimeout(function () { boot.remove(); }, 500);
    }, 12000);
  </script>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
